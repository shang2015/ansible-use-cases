fqcn: check_point.mgmt
product: Check Point Management (Security Management API)
notes:
- Modules named after a resource (for example host, access_rule) support create, update, delete and info;
  verb-named modules (set_, show_, add_, delete_) wrap single management API commands.
use_cases:
