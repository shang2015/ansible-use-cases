fqcn: dellemc.powerscale
product: Dell PowerScale (OneFS)
notes:
- Each module has a matching example playbook under modules/.
use_cases:
- title: Manage filesystems, quotas and storage tiering
  description: Manage filesystems and their ACLs, enforce Smart Quotas, and define file pool policies,
    storage pool tiers and SmartPools settings.
  components:
    filesystem: Filesystems
    smartquota: Smart Quotas
    filepoolpolicy: File pool policies
    storagepooltier: Storage pool tiers
    smartpoolsettings: SmartPools settings
    playbook:modules.filesystem: Filesystems playbook
    playbook:modules.filesystem_mult_ace_container_inherit: 'Filesystem ACL example: multi-trustee, container
      inherit'
    playbook:modules.filesystem_mult_ace_container_inherit_only: 'Filesystem ACL example: allow and deny
      for one trustee'
    playbook:modules.filesystem_mult_ace_object_container_inherit: 'Filesystem ACL example: multi-trustee,
      full inheritance'
    playbook:modules.filesystem_mult_ace_object_inherit: 'Filesystem ACL example: multi-trustee, object
      inherit'
    playbook:modules.filesystem_mult_ace_object_no_prop: 'Filesystem ACL example: multi-trustee, object
      inherit without propagation'
    playbook:modules.smartquota: Smart Quotas playbook
    playbook:modules.filepoolpolicy: File pool policies playbook
    playbook:modules.storagepooltier: Storage pool tiers playbook
    playbook:modules.smartpoolsettings: SmartPools settings playbook
- title: Protect data with snapshots and SyncIQ replication
  description: Take, schedule and expose writable snapshots, and configure SyncIQ policies, jobs, performance
    rules, certificates, global settings and reports.
  components:
    snapshot: Snapshots
    snapshotschedule: Snapshot schedules
    writable_snapshots: Writable snapshots
    synciqpolicy: SyncIQ policies
    synciqjob: SyncIQ jobs
    synciqrules: SyncIQ performance rules
    synciqcertificate: SyncIQ target certificates
    synciq_global_settings: SyncIQ global settings
    synciqreports: SyncIQ reports
    synciqtargetreports: SyncIQ target reports
    playbook:modules.snapshot: Snapshots playbook
    playbook:modules.snapshotschedule: Snapshot schedules playbook
    playbook:modules.writable_snapshots: Writable snapshots playbook
    playbook:modules.synciqpolicy: SyncIQ policies playbook
    playbook:modules.synciqjobs: SyncIQ jobs playbook
    playbook:modules.synciqrules: SyncIQ performance rules playbook
    playbook:modules.synciqcertificate: SyncIQ target certificates playbook
    playbook:modules.synciq_global_settings: SyncIQ global settings playbook
    playbook:modules.synciqreports: SyncIQ reports playbook
    playbook:modules.synciqtargetreports: SyncIQ target reports playbook
