fqcn: azure.azcollection
product: Microsoft Azure
prerequisites:
- An Azure service principal or managed identity with rights on the target subscriptions, stored as an
  Automation Platform credential.
- The azure.azcollection Python requirements (Azure SDK packages) available in the execution environment.
notes:
- Most modules cover both management and read-only info queries for the same resource.
use_cases:
- title: Manage virtual machines and images
  description: Create, resize, start, stop and delete Azure VMs, including extensions, sizes, images,
    SSH keys and availability constructs.
  success: VMs match the declared definition, and re-running the job makes no changes.
  components:
    virtualmachine: Virtual machines
    virtualmachineextension: VM extensions
    virtualmachineimage: VM images (marketplace)
    virtualmachinesize: VM sizes
    vmsku: Compute SKUs
    imagesku: Image SKUs
    image: Custom images
    sshpublickey: SSH public keys
    availabilityset: Availability sets
    proximityplacementgroup: Proximity placement groups
    capacityreservationgroup: Capacity reservation groups
    dedicatedhost: Dedicated hosts
    hostgroup: Dedicated host groups
- title: Manage VM scale sets
