fqcn: f5networks.f5_modules
product: F5 BIG-IP and BIG-IQ
notes:
- Modules cover BIG-IP (bigip_*) and BIG-IQ (bigiq_*) through their iControl REST interfaces; most are
  idempotent and can be run against a device or a cluster member.
use_cases:
- title: Publish applications through virtual servers and pools
  description: Create virtual servers and addresses, pools, members and nodes, SNAT, traffic policies,
    iRules, data groups and iApp or LX packages for local traffic management.
  components:
    bigip_virtual_server: Virtual servers
    bigip_virtual_address: Virtual addresses
    bigip_pool: Pools
    bigip_pool_member: Pool members
    bigip_node: Nodes
    bigip_snat_pool: SNAT pools
    bigip_snat_translation: SNAT translations
    bigip_policy: LTM policies
    bigip_policy_rule: LTM policy rules
    bigip_irule: iRules
    bigip_data_group: Data groups
    bigip_iapp_service: iApp services
    bigip_iapp_template: iApp templates
    bigip_lx_package: LX packages
    bigip_ltm_global: Global LTM settings
