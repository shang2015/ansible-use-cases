fqcn: dellemc.enterprise_sonic
product: Dell Enterprise SONiC
use_cases:
- title: 'Configure Layer 2: interfaces, VLANs and link aggregation'
  description: Manage interface attributes, VLANs and VLAN mapping, access and trunk assignments, LAGs,
    MAC, STP, port breakout and port groups.
  components:
    sonic_interfaces: Interfaces
    sonic_l2_interfaces: Layer 2 interfaces
    sonic_vlans: VLANs
    sonic_vlan_mapping: VLAN mappings
    sonic_lag_interfaces: LAG interfaces
    sonic_mac: MAC settings
    sonic_stp: Spanning tree
    sonic_port_breakout: Port breakout
    sonic_port_group: Port groups
    sonic_pms: Port security
    sonic_lst: Link state tracking
    sonic_br_l2pt: Layer 2 protocol tunneling
    sonic_mclag: MCLAG domains
    sonic_poe: Power over Ethernet
- title: Configure Layer 3 addressing, VRFs and static routing
  description: Set up IP addressing, VRFs, static routes, ECMP, IP neighbours, VRRP, IPv6 router advertisement
    and DHCP relay and snooping.
  components:
    sonic_l3_interfaces: Layer 3 interfaces
    sonic_vrfs: VRFs
    sonic_static_routes: Static routes
    sonic_ecmp_load_share: ECMP load sharing
    sonic_ars: Adaptive routing and switching
    sonic_ip_neighbor: IP neighbour settings
    sonic_ip_neighbor_interfaces: Interface IP neighbour settings
    sonic_ipv6_router_advertisement: IPv6 router advertisement
    sonic_vrrp: VRRP
    sonic_dhcp_relay: DHCP relay
    sonic_dhcp_snooping: DHCP snooping
- title: 'Configure dynamic routing: BGP, OSPF and PIM'
  description: Manage BGP sessions, address families and communities, OSPFv2 and OSPFv3, BFD and multicast
    PIM.
  components:
    sonic_bgp: BGP global
    sonic_bgp_af: BGP address families
    sonic_bgp_neighbors: BGP neighbours
    sonic_bgp_neighbors_af: BGP neighbour address families
    sonic_bgp_as_paths: BGP AS path lists
    sonic_bgp_communities: BGP communities
    sonic_bgp_ext_communities: BGP extended communities
    sonic_ospfv2: OSPFv2 global
    sonic_ospf_area: OSPFv2 areas
    sonic_ospfv2_interfaces: OSPFv2 interfaces
    sonic_ospfv3: OSPFv3 global
    sonic_ospfv3_area: OSPFv3 areas
    sonic_ospfv3_interfaces: OSPFv3 interfaces
    sonic_pim_global: PIM global
    sonic_pim_interfaces: PIM interfaces
    sonic_bfd: BFD
- title: Control routing policy
  description: Maintain prefix lists and route maps used to filter and modify routes.
  components:
    sonic_prefix_lists: Prefix lists
    sonic_route_maps: Route maps
- title: Build data centre overlays with VXLAN and EVPN
  description: Configure VXLAN tunnels, EVPN ESI multihoming and BGP L3 fabrics.
  components:
    sonic_vxlans: VXLANs
    sonic_evpn_esi_multihome: EVPN ESI multihoming
    playbook:bgp_l3_fabric.clos-fabric: BGP Clos fabric
- title: Apply ACLs, flow-based services and control-plane protection
  description: Manage Layer 2 and Layer 3 ACLs and their interface bindings, FBS policies and CoPP.
  components:
    sonic_l2_acls: Layer 2 ACLs
    sonic_l3_acls: Layer 3 ACLs
    sonic_acl_interfaces: ACL interface bindings
    sonic_fbs_classifiers: FBS classifiers
    sonic_fbs_groups: FBS groups
    sonic_fbs_policies: FBS policies
    sonic_fbs_interfaces: FBS interfaces
    sonic_copp: Control-plane policing
- title: Configure QoS, RoCE and lossless Ethernet
  description: Manage QoS buffers, maps, schedulers, WRED, PFC and RoCE settings, DCBx and drop counters.
  components:
