    sonic_qos_interfaces: QoS interfaces
    sonic_qos_maps: QoS maps
    sonic_qos_pfc: QoS PFC
    sonic_qos_scheduler: QoS schedulers
    sonic_qos_wred: QoS WRED profiles
    sonic_roce: RoCE QoS
    sonic_dcbx: DCBx
