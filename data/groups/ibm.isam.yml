fqcn: ibm.isam
product: IBM Security Verify Access (ISAM)
notes:
- Modules are generic wrappers around the ibmsecurity library; most functionality is delivered through
  the bundled roles and example playbooks.
use_cases:
- title: Connect to appliances and run ISAM functions
  description: Connect to Verify Access appliances through the ISAM connection plugin and run ibmsecurity
    functions, CLI commands and connectivity checks.
  components:
    isam: ISAM module (run any ibmsecurity function)
    isamadmin: ISAM admin module
    connection:isam: ISAM appliance connection plugin
    playbook:cli: CLI (playbook)
    playbook:connectivity_check: Connectivity check (playbook)
- title: Transform configuration data for appliances
  description: Reshape YAML configuration, build XML policy documents and read configuration file trees
    for use in ISAM tasks.
  components:
    filter:exclude: Exclude keys filter
    filter:flatten_management_root: Flatten management root filter
    filter:include_only: Include-only filter
    filter:rename_key: Rename key filter
    filter:to_nice_xml: Nice XML filter
    filter:to_xml: XML filter
    lookup:filetree: File tree lookup
- title: Apply a baseline configuration to a fleet
  description: Bootstrap appliances and apply a common site configuration, run sanity checks, or revert
    appliances to their pre-configuration state.
  components:
