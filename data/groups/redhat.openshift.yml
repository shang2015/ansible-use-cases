    openshift_adm_groups_sync: Group sync
    openshift_adm_migrate_template_instances: Template instance migration
    openshift_adm_prune_auth: Authorization pruning
    openshift_adm_prune_builds: Build pruning
    openshift_adm_prune_deployments: Deployment pruning
    openshift_adm_prune_images: Image pruning
