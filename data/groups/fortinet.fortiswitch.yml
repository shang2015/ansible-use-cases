fqcn: fortinet.fortiswitch
product: Fortinet FortiSwitch
notes:
- Most modules configure one FortiSwitch object each; execute_* modules run one-off actions.
use_cases:
- title: Back up, restore and upgrade switch configuration and firmware
  description: Back up default, full and standalone configurations, restore configurations and images,
    stage firmware, upload files and run delayed CLI commands.
  components:
    execute_backup_config: Configuration backup
    execute_backup_default_config: Default configuration backup
    execute_backup_full_config: Full configuration backup
    execute_backup_standalone_config: Standalone configuration backup
    execute_restore_config: Configuration restore
    execute_restore_image: Image restore
    execute_stage_image: Firmware image staging
    execute_upload_file: File upload
    execute_create_delayed_cli_cmds: Delayed CLI commands (create)
    execute_query_delayed_cli_cmds: Delayed CLI commands (query)
    execute_cancel_delayed_cli_cmds: Delayed CLI commands (cancel)
- title: Gather facts and configure through the generic API
  description: Retrieve configuration and monitor facts, configure any switch object through the generic
    JSON module, and convert the current configuration into playbooks.
  components:
    configuration_fact: Configuration facts
    monitor_fact: Monitor facts
    json_generic: Generic JSON configuration
    export_config_playbook: Export configuration as playbooks
- title: Configure ports, VLANs and link aggregation
  description: Configure physical ports, trunks, VLANs, VLAN pruning, forwarding domains, static MAC entries
    and virtual wires.
  components:
    switch_physical_port: Physical ports
    switch_phy_mode: PHY modes
    switch_interface: Ports and trunks
    switch_trunk: Link aggregation
    switch_vlan: VLANs
    switch_vlan_pruning: VLAN pruning
    switch_vlan_tpid: VLAN ether-types
    switch_domain: Forwarding domains
    switch_virtual_wire: Virtual wires
    switch_auto_isl_port_group: Auto ISL port groups
    switch_auto_network: Auto networks
    switch_static_mac: Static MAC entries
    system_mac_address_table: MAC address table
    system_port_pair: Port pairs
- title: Configure Layer 2 protocols and multicast
  description: Configure spanning tree, LLDP, Media Redundancy Protocol, IGMP and MLD snooping, and storm
    control.
  components:
    switch_stp_instance: STP instances
    switch_stp_settings: STP settings
    switch_lldp_profile: LLDP profiles
    switch_lldp_settings: LLDP settings
    switch_mrp_profile: MRP profiles
    switch_mrp_settings: MRP settings
    switch_igmp_snooping_globals: IGMP snooping
    switch_mld_snooping_globals: MLD snooping
    switch_storm_control: Storm control
- title: Control access and secure switch ports
  description: Configure access control lists, 802.1X dynamic policies, MACsec, IP-MAC binding, IP source
    guard, RA guard and device quarantine.
  components:
    switch_acl_ingress: Ingress ACL policies
    switch_acl_egress: Egress ACL policies
    switch_acl_prelookup: Prelookup ACL policies
    switch_acl_802_1x: 802.1X dynamic ACL policies
    switch_acl_policer: ACL policers
    switch_acl_service_custom: Custom ACL services
    switch_acl_settings: ACL global settings
    switch_macsec_profile: MACsec profiles
    switch_ip_mac_binding: IP-MAC binding
    switch_ip_source_guard: IP source guard
    switch_raguard_policy: IPv6 RA guard policies
    switch_quarantine: Quarantined devices
    switch_security_feature: Security feature controls
- title: Configure QoS and time synchronisation
  description: Configure QoS mappings and policies, ToS-based priority, PTP policies and profiles, and
    NTP.
  components:
    switch_qos_dot1p_map: 802.1p QoS maps
    switch_qos_ip_dscp_map: DSCP QoS maps
    switch_qos_qos_policy: QoS egress policies
