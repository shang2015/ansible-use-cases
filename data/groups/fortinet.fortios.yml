fqcn: fortinet.fortios
product: Fortinet FortiGate (FortiOS)
prerequisites:
- A FortiGate with the REST API enabled and an API token (or admin credentials) for an account with sufficient
  access profile, stored as an Automation Platform custom credential.
- Network reachability from the execution environment to the FortiGate management interface (HTTPS), for
  example through the httpapi connection plugin.
notes:
- Most modules configure one FortiOS table or object; running a job against a FortiGate with a different
  FortiOS version may reject options that version does not support.
- Per-VDOM objects accept a vdom parameter, so one use case can cover several VDOMs on the same device.
