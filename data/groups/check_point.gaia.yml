  components:
    dynamic_content: Dynamic content
    dynamic_content_layer: Dynamic content layer
    dynamic_content_layers: Dynamic content layers
    simulate_packet: Packet simulation
    run_script: Run scripts
    put_file: File upload
    run_reboot: Reboot
- title: Inspect version, features and diagnostics
  description: Query Gaia version, API versions, features, extended commands, asset details and diagnostics.
  components:
    version: Gaia version
    api_versions: API versions
    features: Features
    extended_commands: Extended commands
    asset: Asset
    diagnostics: Diagnostics
    diagnostics_topics: Diagnostics topics
