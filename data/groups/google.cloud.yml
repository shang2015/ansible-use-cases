    vertexai_deployment_resource_pool: Deployment resource pools
    vertexai_featurestore: Feature stores
    vertexai_featurestore_entitytype: Feature store entity types
    vertexai_featurestore_entitytype_feature: Feature store entity type features
    vertexai_feature_group: Feature groups
    vertexai_feature_group_feature: Feature group features
    vertexai_feature_online_store: Online feature stores
    vertexai_feature_online_store_featureview: Online feature views
    vertexai_index: Vector indexes
    vertexai_index_endpoint: Index endpoints
    vertexai_index_endpoint_deployed_index: Deployed indexes
    vertexai_metadata_store: Metadata stores
    vertexai_rag_engine_config: RAG engine configuration
    vertexai_reasoning_engine: Reasoning engines
    vertexai_tensorboard: TensorBoards
    colab_runtime: Colab runtimes
    colab_runtime_template: Colab runtime templates
    colab_schedule: Colab schedules
    colab_notebook_execution: Colab notebook executions
