- title: Migrate workloads and volumes
  description: Export instances and detached volumes, then copy their data to the destination with NBD
    exports and volume transfers, cleaning up temporary volumes afterwards.
  components:
    export_detached_volume: Export detached volume
    export_workload: Export workload
    import_volumes_export: Import volumes export
    import_volumes_src_cleanup: Import volumes src cleanup
    import_volumes_transfer: Import volumes transfer
    import_workload_create_instance: Import workload create instance
