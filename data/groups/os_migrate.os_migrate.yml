fqcn: os_migrate.os_migrate
product: OpenStack (workload migration)
notes:
- Most resources have an export module, an import module, a playbook and a role of the same name.
use_cases:
- title: Migrate projects, users and role assignments
  description: Export projects, users and their role assignments from a source OpenStack cloud and import
    them into a destination cloud.
  components:
    export_project: Export project
    export_user: Export user
    export_user_project_role_assignment: Export user project role assignment
    import_project: Import project
    import_user: Import user
    import_user_project_role_assignment: Import user project role assignment
    os_role_assignments: Role assignments information
    playbook:export_projects: Export projects playbook
    playbook:export_user_project_role_assignments: Export user project role assignments playbook
    playbook:export_users: Export users playbook
    playbook:import_projects: Import projects playbook
    playbook:import_user_project_role_assignments: Import user project role assignments playbook
    playbook:import_users: Import users playbook
    role:export_projects: Export projects role
    role:export_user_project_role_assignments: Export user project role assignments role
    role:export_users: Export users role
    role:import_projects: Import projects role
    role:import_user_project_role_assignments: Import user project role assignments role
    role:import_users: Import users role
- title: Migrate networks and security groups
  description: Export and import networks, subnets, routers and router interfaces, and security groups
    with their rules, and query routers and security groups.
  components:
    export_network: Export network
    export_router: Export router
    export_router_interfaces: Export router interfaces
    export_security_group: Export security group
    export_security_group_rules: Export security group rules
    export_subnet: Export subnet
    import_network: Import network
    import_router: Import router
    import_router_interface: Import router interface
    import_security_group: Import security group
    import_security_group_rule: Import security group rule
    import_subnet: Import subnet
    os_routers: Routers information
    os_security_groups: Security groups information
    playbook:export_networks: Export networks playbook
    playbook:export_router_interfaces: Export router interfaces playbook
    playbook:export_routers: Export routers playbook
    playbook:export_security_group_rules: Export security group rules playbook
    playbook:export_security_groups: Export security groups playbook
    playbook:export_subnets: Export subnets playbook
    playbook:import_networks: Import networks playbook
    playbook:import_router_interfaces: Import router interfaces playbook
    playbook:import_routers: Import routers playbook
    playbook:import_security_group_rules: Import security group rules playbook
    playbook:import_security_groups: Import security groups playbook
    playbook:import_subnets: Import subnets playbook
    role:export_networks: Export networks role
    role:export_router_interfaces: Export router interfaces role
    role:export_routers: Export routers role
    role:export_security_group_rules: Export security group rules role
    role:export_security_groups: Export security groups role
    role:export_subnets: Export subnets role
    role:import_networks: Import networks role
    role:import_router_interfaces: Import router interfaces role
    role:import_routers: Import routers role
    role:import_security_group_rules: Import security group rules role
    role:import_security_groups: Import security groups role
    role:import_subnets: Import subnets role
- title: Migrate flavors, images and keypairs
  description: Export and import Nova flavors, Glance images and keypairs, including users' keypairs.
  components:
    export_flavor: Export flavor
    export_image_blob: Export image blob
    export_image_meta: Export image meta
    export_keypair: Export keypair
    import_flavor: Import flavor
    import_image: Import image
    import_keypair: Import keypair
    os_keypairs: Keypairs information
