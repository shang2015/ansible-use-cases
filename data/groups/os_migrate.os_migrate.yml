    role:import_detached_volumes: Import detached volumes role
    role:import_from_hypervisor: Import from hypervisor role
    role:import_workloads: Import workloads role
- title: Deploy conversion hosts and gather migration facts
  description: Deploy and delete the conversion hosts that move data, prepare the source and destination
    clouds, check the authenticated user and conversion host, and filter data in playbooks.
  components:
    auth: Authenticated user and project information
    os_conversion_host: Conversion host information
    filter:json_query: JMESPath query filter
    filter:stringfilter: String match filter
    playbook:delete_conversion_hosts: Delete conversion hosts playbook
    playbook:deploy_conversion_hosts: Deploy conversion hosts playbook
    role:conversion_host: Conversion host role
    role:conversion_host_content: Conversion host content role
    role:prelude_common: Prelude common role
    role:prelude_dst: Prelude dst role
    role:prelude_src: Prelude src role
- title: Validate migration data
  description: Read exported resource files and validate the data directory and resource files before
    import.
  components:
    read_resources: Resource file reading
    validate_resource_files: Validate resource files
    playbook:validate_data_dir: Validate data dir playbook
    role:validate_data_dir: Validate data dir role
    role:validate_resource_files: Validate resource files role
