fqcn: opensvc.cluster
product: OpenSVC
use_cases:
- title: Build and remove clusters
  description: Build a cluster from a server inventory and remove clusters and their services.
  components:
    role:provision_cluster: Cluster provisioning
    role:unprovision_cluster: Cluster removal
    role:unprovision_services: Service removal
- title: Set up cluster networking, ingress and storage
  description: Install the backend network and CNI, name service, Envoy ingress gateway, DRBD prerequisites
    and storage pools.
  components:
    role:install_backend_network: Backend network
    role:install_cni: CNI plugins
    role:install_dns: Name service
    role:install_envoy: Envoy ingress gateway
    role:install_drbd: DRBD prerequisites
    role:install_pool: Storage pools
