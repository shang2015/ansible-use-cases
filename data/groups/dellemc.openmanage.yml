fqcn: dellemc.openmanage
product: Dell OpenManage (iDRAC, OpenManage Enterprise, Redfish)
notes:
- Capabilities are available as modules, roles and ready-to-run example playbooks for iDRAC, OpenManage
  Enterprise (OME), OpenManage Enterprise Modular, OMEVV and generic Redfish servers.
