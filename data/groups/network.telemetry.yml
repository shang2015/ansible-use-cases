fqcn: network.telemetry
product: "Network telemetry"
use_cases:
- title: "Manage telemetry configuration and detect drift"
  description: "Gather and persist telemetry settings, detect drift from the desired state, deploy changes and remediate drift on network devices."
  components:
    "role:gather": "Gather facts"
    "role:persist": "Persist facts as host variables"
    "role:detect": "Detect configuration drift"
    "role:remediate": "Remediate drift"
    "role:deploy": "Deploy configuration"
- title: "Collect and verify telemetry"
  description: "Deploy a Docker and Telegraf telemetry collector and check telemetry configuration health on Cisco NX-OS devices."
  components:
    "role:deploy_collector": "Telemetry collector"
    "role:health_checks": "Health checks"
