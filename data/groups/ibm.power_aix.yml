fqcn: ibm.power_aix
product: IBM AIX on Power
notes:
- Many demo playbooks show a single module with various options; they are grouped here with the module
  they exercise.
use_cases:
- title: Patch and update AIX software
  description: Install and update filesets, apply interim fixes, generate FLRTVC reports, download fixes
    from IBM Fix Central, and bootstrap DNF on AIX.
  components:
    installp: Filesets (installp)
    geninstall: Generic installer
    install_all_updates: Install all updates
    emgr: Interim fixes (emgr)
    flrtvc: FLRTVC security fix reports
    suma: SUMA fix downloads
    lpp: Installed software facts
    role:power_aix_bootstrap: DNF bootstrap role
    playbook:demo_installp: Fileset installation demo
    playbook:demo_install_all_updates: Update-all demo
    playbook:demo_emgr: Interim fix demo
    playbook:demo_flrtvc: FLRTVC demo
    playbook:demo_flrtvc_local_patch_server: FLRTVC with local patch server demo
    playbook:demo_shell_flrtvc_wget_ifix: Sync ifixes to a web server demo
    playbook:demo_suma: SUMA demo
    playbook:demo_lpp_facts: Installed software facts demo
    playbook:demo_dnf: DNF package install demo
    playbook:demo_dnf_bootstrap: DNF bootstrap demo
    playbook:demo_dnf_bootstrap_local: DNF bootstrap from local repository demo
    playbook:demo_update-all-hosts: Update all hosts demo
- title: Apply kernel and library updates without downtime
  description: Run live kernel updates and live library updates, and clean up failed live update operations.
  components:
