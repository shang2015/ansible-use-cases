fqcn: vmware.alb
product: VMware Avi Load Balancer (NSX Advanced Load Balancer)
notes:
- Most modules map one-to-one to an Avi Controller REST object and are named after it; module names have
  the avi_ prefix.
use_cases:
- title: Publish applications with virtual services and pools
  description: Create virtual services and their VIPs, server pools and pool groups, health monitors,
    data scripts and the address and string groups they use.
  components:
    virtualservice: Virtual services
    vsvip: Virtual service VIPs
    vsgs: Virtual service GSLB mappings
    pool: Pools
    poolgroup: Pool groups
    poolgroupdeploymentpolicy: Pool group deployment policies
    healthmonitor: Health monitors
    vsdatascriptset: Data script sets
    microservicegroup: Microservice groups
    ipaddrgroup: IP address groups
    stringgroup: String groups
    labelgroup: Label groups
    labelprofile: Label profiles
    prioritylabels: Priority labels
    serverautoscalepolicy: Server autoscale policies
    autoscalelaunchconfig: Autoscale launch configurations
    protocolparser: Protocol parsers
    lookup:avi: Avi object lookup
- title: Shape traffic with policies and profiles
  description: Define application, network and persistence profiles, HTTP, L4, DNS and NAT policies, rate
    limits, error pages and traffic cloning.
  components:
    applicationprofile: Application profiles
    applicationpersistenceprofile: Persistence profiles
    networkprofile: Network profiles
    httppolicyset: HTTP policy sets
    l4policyset: L4 policy sets
    dnspolicy: DNS policies
    natpolicy: NAT policies
    networksecuritypolicy: Network security policies
    ratelimitconfiguration: Rate limit configurations
    errorpageprofile: Error page profiles
    errorpagebody: Error page bodies
    trafficcloneprofile: Traffic clone profiles
    icapprofile: ICAP profiles
    ssopolicy: SSO policies
- title: Protect applications with WAF, bot and API security
  description: Configure web application firewall policies and profiles, bot detection, IP reputation,
    CSRF protection and API policies and schemas.
  components:
    wafpolicy: WAF policies
    wafprofile: WAF profiles
    wafpolicypsmgroup: WAF positive security model groups
    wafapplicationsignatureprovider: WAF signature providers
    positivesecuritypolicy: Positive security policies
    securitypolicy: Security policies
    securitymanagerdata: Security manager data
    csrfpolicy: CSRF policies
    botdetectionpolicy: Bot detection policies
    botmapping: Bot mappings
    botconfigconsolidator: Bot configuration consolidators
    botipreputationtypemapping: Bot IP reputation mappings
    ipreputationdb: IP reputation databases
    apipolicy: API policies
    apipath: API paths
    apiratelimitprofile: API rate limit profiles
    apischema: API schemas
    apispecgenerate: API spec generation
- title: Manage certificates, TLS and authentication
  description: Manage SSL certificates and profiles, certificate management and PKI profiles, HSM groups,
    JWT settings and client authentication profiles.
  components:
    sslkeyandcertificate: SSL keys and certificates
    sslprofile: SSL profiles
