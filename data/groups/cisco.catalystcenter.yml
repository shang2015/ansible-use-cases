fqcn: cisco.catalystcenter
product: Cisco Catalyst Center
notes:
- Most modules are generated from the Catalyst Center API; names ending in _count, _query or _info read data, while
  *_workflow_manager modules and the matching roles are the recommended declarative way to manage a feature.
