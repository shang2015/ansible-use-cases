  description: Manage Percepxion user accounts and bulk suspend or restore, manage local accounts on SLC9000
    devices, and lock down access outside an allowlist.
  components:
    percepxion_users: Percepxion users
    slc_users: SLC9000 sysadmin account
    role:oob_user_management: User management role
    playbook:percepxion.percepxion_users: Percepxion user playbook
    playbook:slc.slc_users: SLC9000 user playbook
    playbook:lockdown: Access lockdown playbook
- title: Manage firmware across the fleet
  description: Check firmware compliance and trigger firmware updates on Percepxion-managed fleets and
