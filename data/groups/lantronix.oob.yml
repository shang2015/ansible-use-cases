    playbook:percepxion.percepxion_devices: Device inventory playbook
    playbook:percepxion.percepxion_device_tags: Device tag playbook
    playbook:percepxion.percepxion_smart_groups: Smart group playbook
    playbook:percepxion.percepxion_projects: Project assignment playbook
- title: Configure, schedule and monitor through Percepxion
  description: Manage configuration content, scheduled job groups and event rules, and query telemetry
    and audit logs.
  components:
    percepxion_config: Configuration content
    percepxion_jobs: Scheduled job groups
    percepxion_event_rules: Event rules
    percepxion_telemetry: Telemetry
