fqcn: hpe.ilo
product: HPE iLO (Integrated Lights-Out)
notes:
- Modules use the iLO Redfish API; the bundled roles and example playbooks cover the same operations one
  task at a time.
use_cases:
- title: Configure BIOS and boot settings
  description: Read and change BIOS attributes, boot mode, boot order and one-time boot, restore BIOS
    defaults, enable or disable PXE and verify applied settings.
  components:
    boot: Boot operations
    playbook:Bios.disable_pxe: Disable pxe (playbook)
    playbook:Bios.enable_pxe: Enable pxe (playbook)
    playbook:Bios.get_bios_attributes: Get BIOS attributes (playbook)
    playbook:Bios.get_bios_boot_order: Get BIOS boot order (playbook)
    playbook:Bios.get_bios_registries: Get BIOS registries (playbook)
    playbook:Bios.get_boot_override: Get boot override (playbook)
    playbook:Bios.reboot_system: Reboot system (playbook)
    playbook:Bios.set_bios_attribute: Set BIOS attribute (playbook)
    playbook:Bios.set_bootmode_legacybios: Set bootmode legacybios (playbook)
    playbook:Bios.set_bootmode_uefi: Set bootmode uefi (playbook)
    playbook:Bios.set_default_bios_settings: Set default BIOS settings (playbook)
    playbook:Bios.set_onetime_boot: Set onetime boot (playbook)
    playbook:Bios.verify_bios_attributes: Verify BIOS attributes (playbook)
    playbook:Network.get_boot_settings: Get boot settings (playbook)
    playbook:Network.verify_uefi_boot_order: Verify uefi boot order (playbook)
    role:changbiosattr: Change BIOS attribute (role)
    role:get_bios_registries: Get BIOS registries (role)
    role:get_boot_settings: Get boot settings (role)
    role:getbiosattr: Get BIOS attributes (role)
    role:getbootorder: Get boot order (role)
    role:getbootoverride: Get boot override (role)
    role:setbiosdefault: Set default BIOS settings (role)
    role:setonetimeboot: Set one-time boot (role)
    role:verify_bios_attributes: Verify BIOS attributes (role)
    role:verify_uefi_boot_order: Verify uefi boot order (role)
