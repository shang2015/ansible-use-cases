    playbook:nios_dtc_server_wapi_2_14_example: DTC server (WAPI 2.14) sample
    playbook:create_dtc_pool: DTC pool sample
    playbook:create_dtc_lbdn: DTC LBDN sample
    playbook:create_dtc_topology: DTC topology creation sample
    playbook:delete_dtc_topology: DTC topology deletion sample
    playbook:create_dtc_monitor_http: HTTP monitor creation sample
    playbook:delete_dtc_monitor_http: HTTP monitor deletion sample
    playbook:create_dtc_monitor_icmp: ICMP monitor creation sample
    playbook:delete_dtc_monitor_icmp: ICMP monitor deletion sample
    playbook:create_dtc_monitor_pdp: PDP monitor creation sample
    playbook:delete_dtc_monitor_pdp: PDP monitor deletion sample
    playbook:create_dtc_monitor_sip: SIP monitor creation sample
    playbook:delete_dtc_monitor_sip: SIP monitor deletion sample
    playbook:create_dtc_monitor_snmp: SNMP monitor creation sample
    playbook:delete_dtc_monitor_snmp: SNMP monitor deletion sample
    playbook:create_dtc_monitor_tcp: TCP monitor creation sample
    playbook:delete_dtc_monitor_tcp: TCP monitor deletion sample
- title: Administer the Grid
  description: Manage Grid members and admin users and restart Grid services.
  components:
    member: Grid members
    adminuser: Admin users
    restartservices: Service restarts
    playbook:update_member: Member update sample
    playbook:create_adminuser: Admin user sample
    playbook:restart_services: Service restart sample
- title: Query NIOS and allocate next-available resources
  description: Use NIOS as dynamic inventory and look up objects, the next free IP, network or VLAN ID.
  components:
    inventory:nios_inventory: NIOS inventory
    lookup:nios_lookup: Object lookup
    lookup:nios_next_ip: Next available IP
    lookup:nios_next_network: Next available network
    lookup:nios_next_vlan_id: Next available VLAN ID
