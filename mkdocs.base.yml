site_name: Ansible Automation Use Cases
site_description: >-
  Ansible Automation Platform use cases by domain, each mapped to the Red Hat
  Certified and Validated Content collections, modules and roles that deliver it.
site_url: https://shang2015.github.io/ansible-use-cases/
repo_url: https://github.com/shang2015/ansible-use-cases
repo_name: shang2015/ansible-use-cases
edit_uri: edit/main/docs/
copyright: >-
  Community reference, not an official Red Hat publication. Ansible and Red Hat
  are trademarks of Red Hat, Inc.

theme:
  name: material
  language: en
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      separator: '[\s\-\.\_]+'

hooks:
  - hooks/use_case_tables.py

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/explorer.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

not_in_nav: |
  /use-cases/**/_*.md
  /collections/*.md
